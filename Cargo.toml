[package]
name = "pivot"
version = "0.1.0"
edition = "2024"
description = "Real-time pitch and key shifting effect"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false, features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
num-complex = "0.4"
realfft = "3"
signalsmith-stretch = "0.1.3"

[workspace]
members = ["xtask"]
resolver = "3"

[patch."https://github.com/BillyDM/egui-baseview.git"]
egui-baseview = { path = "vendor/egui-baseview" }

[profile.release]
strip = "none"
