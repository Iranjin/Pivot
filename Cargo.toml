[package]
name = "pivot"
version = "1.0.0"
edition = "2024"
description = "Real-time pitch and key shifting effect"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { path = "vendor/nih-plug", default-features = false, features = ["assert_process_allocs"] }
nih_plug_egui = { path = "vendor/nih-plug/nih_plug_egui" }
num-complex = "0.4"
realfft = "3"
signalsmith-stretch = "0.1.3"

[workspace]
members = ["xtask"]
resolver = "3"

[patch."https://github.com/BillyDM/egui-baseview.git"]
egui-baseview = { path = "vendor/egui-baseview" }

[profile.release]
strip = "none"
